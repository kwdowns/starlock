[project]
name = "evf"
version = "0.5.3"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Pillow",
    "numpy",
    # tetra3rs transitively pulls gaia-catalog (~17 MB bundled Gaia DR3 +
    # Hipparcos blob). gaia-catalog is needed by scripts/build_tetra3rs_catalog.py
    # to regenerate data/tetra3rs_gaia.bin; the runtime path
    # (SolverDatabase.load_from_file) doesn't import gaia_catalog.
    "tetra3rs==0.7.1",
    "playsound3",
    "aiohttp",
    "pyerfa>=2.0.0",
    "zeroconf>=0.154.0",
    "astronomy-engine>=2.1.19",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
    # Tests parse packaging/headless/user-data; scripts/sync_catalog.py and
    # scripts/make_pi_label.py too.
    "pyyaml>=6.0",
    # scripts/make_pi_label.py: QR code, text as outlines with kerning, and
    # the PNG (FreeType rasterizer via fontTools' FreeTypePen)
    "segno>=1.6",
    "fonttools>=4.50",
    "uharfbuzz>=0.40",
    "freetype-py>=2.4",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/evf"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
