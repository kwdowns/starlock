name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release with artifacts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Raspberry Pi — starlock-headless .deb (arm64, always headless)
  # Built natively on an ARM runner inside a Debian bookworm container (glibc
  # 2.36) so the one package installs on Pi OS bookworm and trixie.
  # ---------------------------------------------------------------------------
  build-headless-deb:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        run: |
          missing=()
          for f in data/tetra3rs_gaia.bin data/VERSION.json marketing/inapp-title.png; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Required files missing:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(python3 -c "import json; print(json.load(open('data/VERSION.json'))['app_version'])")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 -c "
          import json
          with open('data/VERSION.json', 'r') as f:
              data = json.load(f)
          data['app_version'] = '$VERSION'
          with open('data/VERSION.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

      - name: Build .deb
        # scripts/build_headless_deb.sh: camera_server, React UI, bundled
        # python-build-standalone 3.12 + runtime deps (no dev group),
        # data, systemd unit, maintainer scripts → dpkg-deb.
        run: bash scripts/build_headless_deb.sh

      - name: Smoke test (install + run on bookworm and trixie)
        run: bash scripts/smoke_test_headless_deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Starlock-headless-deb
          path: build/starlock-headless_*_arm64.deb
          retention-days: 90

      # First-boot config for the ready-made SD card (docs/rpi-headless.md),
      # attached to each release next to the .deb.
      - name: Upload user-data
        uses: actions/upload-artifact@v4
        with:
          name: Starlock-headless-user-data
          path: packaging/headless/user-data
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Create GitHub Release (only on tag push or manual with create_release)
  # ---------------------------------------------------------------------------
  release:
    needs: [build-headless-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # List bare file names, as downloaded, so `sha256sum -c` works in a
      # folder of downloads. GitHub turns "~" in asset names into ".", so
      # the .deb (0.3.0~beta7-1) is renamed to that form before hashing.
      - name: Generate checksums
        run: |
          cd artifacts
          for f in Starlock-headless-deb/*~*.deb; do
            [ -e "$f" ] && mv "$f" "${f//\~/.}"
          done
          find . -type f \( -name "*.deb" -o -name "user-data" \) \
            | sort \
            | while read -r f; do
                (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
              done > ../checksums-sha256.txt
          cat ../checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Starlock ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/Starlock-headless-deb/starlock-headless_*_arm64.deb
            artifacts/Starlock-headless-user-data/user-data
            checksums-sha256.txt
